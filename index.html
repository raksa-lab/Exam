<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Engineering Month 1 Exam | ប្រឡងវិស្វកម្ម AI ខែទី ១ (200+ Question Bank)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Kantumruy Pro', sans-serif;
      background-color: #f8fafc;
    }
    .khmer-text {
      font-family: 'Kantumruy Pro', sans-serif;
      line-height: 1.8;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- Top Sticky Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow">
          AI
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg text-slate-900">
            AI Engineering Month 1 Exam
            <span class="text-indigo-600 font-normal text-sm ml-1 khmer-text">| វិញ្ញាសាប្រឡងវិស្វកម្ម AI ខែទី ១</span>
          </h1>
          <p class="text-xs text-slate-500">
            <span id="poolCountBadge" class="font-semibold text-indigo-600">208</span> Total Questions in Bank • Draws 50 Random Questions per Test
          </p>
        </div>
      </div>

      <!-- Controls: Language, Timer, New Exam -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-3">
        <!-- Language Switcher -->
        <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-medium">
          <button onclick="setLanguage('both')" id="lang-both" class="px-2.5 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition">
            EN + ខ្មែរ
          </button>
          <button onclick="setLanguage('en')" id="lang-en" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition">
            EN Only
          </button>
          <button onclick="setLanguage('km')" id="lang-km" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition khmer-text">
            ខ្មែរ
          </button>
        </div>

        <!-- Live Timer -->
        <div class="flex items-center gap-2 bg-slate-900 text-white px-3.5 py-1.5 rounded-lg text-sm font-mono shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="timerDisplay">00:00</span>
        </div>

        <!-- New Random 50 Button -->
        <button onclick="startNewRandomExam()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-lg shadow-sm transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>New Random 50 / ប្ដូរវិញ្ញាសាថ្មី</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Sidebar: Progress, Filters & 50-Question Matrix -->
    <aside class="lg:col-span-4 xl:col-span-3 space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm sticky top-20 space-y-4">
        
        <!-- Progress Bar -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
            <span>Progress / ការធ្វើវិញ្ញាសា</span>
            <span id="progressText">0 / 50 Answered</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Topic Filter -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
            Filter Topic / ជ្រើសរើសប្រធានបទ
          </label>
          <select id="topicFilter" onchange="renderQuestions()" class="w-full text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="ALL">All 8 Syllabus Topics (50)</option>
            <option value="AI Landscape">1. AI Landscape</option>
            <option value="Python & Concurrency">2. Python Virtual Env & Concurrency</option>
            <option value="NumPy & Preprocessing">3. Data Handling in NumPy & Preprocessing</option>
            <option value="ML Workflow">4. Machine Learning Workflow</option>
            <option value="Vectors & Distance">5. Vector Ops, Cosine Similarity & Distance</option>
            <option value="Regression & Overfitting">6. Regression Loss & Overfitting</option>
            <option value="Classification & Evaluation">7. Classification & Performance Evaluation</option>
            <option value="Gradient Descent & Generalization">8. Gradient Descent & Generalization</option>
          </select>
        </div>

        <!-- Question Type Filter -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
            Question Type / ប្រភេទសំណួរ
          </label>
          <select id="typeFilter" onchange="renderQuestions()" class="w-full text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="ALL">All Types (T/F, MCQ, Fill, Exercise, Q&A)</option>
            <option value="TF">True / False (ពិត ឬ មិនពិត)</option>
            <option value="MCQ">Multiple Choice (ជ្រើសរើសចម្លើយ)</option>
            <option value="FILL">Fill in the Blank (បំពេញចន្លោះ)</option>
            <option value="EX">Exercise / Calculation (លំហាត់គណនា)</option>
            <option value="QA">Q&A Conceptual (សំណួរទ្រឹស្ដី)</option>
          </select>
        </div>

        <!-- 50-Question Navigator Grid -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Question Matrix (1–50)</span>
            <span class="text-[11px] text-slate-400">Click to jump</span>
          </div>
          <div id="questionMatrix" class="grid grid-cols-10 gap-1.5 max-h-56 overflow-y-auto custom-scroll p-1"></div>
        </div>

        <!-- Submit Exam Button -->
        <div class="pt-2 border-t border-slate-100 space-y-2">
          <button onclick="submitExam()" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition text-sm">
            Submit Exam & See Score / បញ្ជូនវិញ្ញាសា
          </button>
          <button onclick="browseAllBank()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-xl transition text-xs">
            View Full 208-Question Bank / មើលសំណួរទាំងអស់ ២០៨
          </button>
        </div>
      </div>
    </aside>

    <!-- Right Column: Results Dashboard + Questions List -->
    <section class="lg:col-span-8 xl:col-span-9 space-y-6">

      <!-- Results Summary Banner (Hidden until submitted) -->
      <div id="resultBanner" class="hidden bg-white rounded-2xl border-2 border-indigo-500 p-6 shadow-md space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4">
          <div>
            <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 mb-1">
              Exam Completed • លទ្ធផលប្រឡង
            </span>
            <h2 class="text-2xl font-bold text-slate-900" id="scoreHeadline">Score: 0 / 50 (0%)</h2>
            <p class="text-sm text-slate-600 khmer-text" id="scoreSubtext"></p>
          </div>
          <div class="flex gap-3">
            <div class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-center">
              <div class="text-xs text-slate-500">Time Taken / រយៈពេល</div>
              <div class="text-lg font-bold font-mono text-slate-800" id="finalTimeTaken">00:00</div>
            </div>
            <button onclick="startNewRandomExam()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm shadow">
              Retake with New Random 50
            </button>
          </div>
        </div>
        <!-- Topic Breakdown Grid -->
        <div id="topicBreakdownGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
      </div>

      <!-- Questions Container -->
      <div id="questionsContainer" class="space-y-4"></div>

    </section>
  </main>

  <script>
    // ============================================================================
    // 1. CURATED CORE QUESTIONS (59 Core Syllabus + Mentor Bonus Questions, EN + KM)
    // ============================================================================
    const coreQuestions = [
      // --- TOPIC 1: AI LANDSCAPE ---
      {
        topic: "AI Landscape", type: "TF",
        en: "Deep Learning is a subset of Machine Learning, which is a subset of Artificial Intelligence.",
        km: "Deep Learning គឺជាផ្នែកមួយនៃ Machine Learning ហើយ Machine Learning គឺជាផ្នែកមួយនៃ Artificial Intelligence (AI)។",
        options: ["True", "False"], ans: "True",
        expEn: "AI is the broadest field; Machine Learning learns patterns from data; Deep Learning uses multi-layered neural networks.",
        expKm: "AI គឺជាវិស័យទូលំទូលាយបំផុត ចំណែក ML រៀនលំនាំពីទិន្នន័យ ហើយ DL ប្រើបណ្ដាញសរសៃប្រសាទសិប្បនិម្មិតច្រើនស្រទាប់ (Multi-layered Neural Networks)។"
      },
      {
        topic: "AI Landscape", type: "MCQ",
        en: "Which type of AI system is designed to perform a single dedicated task rather than general human-like reasoning?",
        km: "តើប្រព័ន្ធ AI ប្រភេទណាដែលត្រូវបានបង្កើតឡើងដើម្បីធ្វើកិច្ចការជាក់លាក់ណាមួយ ជាជាងការគិតពិចារណាទូទៅដូចមនុស្ស?",
        options: ["Narrow AI (Weak AI)", "Artificial General Intelligence (AGI)", "Artificial Superintelligence (ASI)", "Quantum Symbolic AI"],
        ans: "Narrow AI (Weak AI)",
        expEn: "Narrow AI (Weak AI) operates within a limited, specific constraint (e.g., spam filtering, chess, facial recognition).",
        expKm: "Narrow AI (ឬ Weak AI) ត្រូវបានបង្វឹកសម្រាប់តែកិច្ចការជាក់លាក់មួយប៉ុណ្ណោះ ដូចជាការច្រោះអ៊ីមែលឥតបានការ ឬការស្គាល់មុខមនុស្ស។"
      },
      {
        topic: "AI Landscape", type: "FILL",
        en: "In Reinforcement Learning, an agent interacts with an environment and learns sequential actions by maximizing cumulative ________.",
        km: "នៅក្នុង Reinforcement Learning ភ្នាក់ងារ (Agent) ធ្វើអន្តរកម្មជាមួយបរិស្ថាន ហើយរៀនធ្វើការសម្រេចចិត្តដោយបង្កើន ________ សរុបឱ្យបានខ្ពស់បំផុត។",
        ans: "reward",
        expEn: "Reinforcement Learning agents optimize policies to maximize cumulative reward.",
        expKm: "ភ្នាក់ងារ Reinforcement Learning រៀនតាមរយៈការបង្កើនរង្វាន់សរុប (Cumulative Reward)។"
      },
      {
        topic: "AI Landscape", type: "QA",
        en: "Explain the fundamental difference between Discriminative models and Generative models.",
        km: "ចូរពន្យល់ពីភាពខុសគ្នាជាមូលដ្ឋានរវាង Discriminative Models និង Generative Models។",
        ans: "Discriminative models learn P(Y|X) decision boundaries; Generative models learn P(X,Y) or P(X) to generate new data.",
        keywords: ["boundary", "p(y|x)", "generate", "distribution", "ព្រំដែន", "បង្កើតទិន្នន័យ"],
        expEn: "Discriminative models learn the decision boundary P(Y|X) (e.g., Logistic Regression, SVM). Generative models learn the underlying data distribution P(X) or P(X,Y) to sample new instances.",
        expKm: "Discriminative ម៉ូដែលរៀនពីព្រំដែនបែងចែក P(Y|X) រីឯ Generative ម៉ូដែលរៀនពីរបាយទិន្នន័យដើម្បីបង្កើតទិន្នន័យថ្មីៗ។"
      },
      {
        topic: "AI Landscape", type: "MCQ",
        en: "Grouping raw unlabeled customer purchasing histories into distinct behavioral segments is an example of:",
        km: "ការបែងចែកទិន្នន័យអតិថិជនដែលគ្មានស្លាក (Unlabeled data) ទៅជាក្រុមតាមទម្លាប់ទិញទំនិញ គឺជាឧទាហរណ៍នៃ៖",
        options: ["Unsupervised Learning (Clustering)", "Supervised Learning (Regression)", "Supervised Learning (Classification)", "Reinforcement Learning"],
        ans: "Unsupervised Learning (Clustering)",
        expEn: "Discovering hidden structure or clusters in unlabeled data is Unsupervised Learning.",
        expKm: "ការរកមើលរចនាសម្ព័ន្ធ ឬការបែងចែកក្រុម (Clustering) លើទិន្នន័យដែលគ្មានស្លាក គឺជា Unsupervised Learning។"
      },
      {
        topic: "AI Landscape", type: "MCQ",
        en: "What was the main limitation of Symbolic (Rule-Based) AI that led to the rise of Statistical Machine Learning?",
        km: "តើអ្វីជាដែនកំណត់ចម្បងនៃ Symbolic AI (ប្រព័ន្ធផ្អែកលើច្បាប់ IF-THEN) ដែលនាំឱ្យមានការរីកចម្រើននៃ Machine Learning?",
        options: [
          "Inability to scale and handle noisy, unstructured real-world data (images, audio, text)",
          "Inability to evaluate basic IF-THEN boolean logic",
          "Symbolic AI required too many GPUs",
          "It could only output probabilities between 0 and 1"
        ],
        ans: "Inability to scale and handle noisy, unstructured real-world data (images, audio, text)",
        expEn: "Hand-crafting rules fails when facing noisy, ambiguous, high-dimensional unstructured data.",
        expKm: "ការសរសេរច្បាប់ដោយដៃមិនអាចគ្រប់គ្រងទិន្នន័យស្មុគស្មាញ និងមិនមានរចនាសម្ព័ន្ធច្បាស់លាស់ដូចជារូបភាព ឬសំឡេងបានទេ។"
      },

      // --- TOPIC 2: PYTHON VIRTUAL ENVIRONMENT & CONCURRENCY ---
      {
        topic: "Python & Concurrency", type: "MCQ",
        en: "Which command creates an isolated Python 3 virtual environment named 'ai_env'?",
        km: "តើពាក្យបញ្ជា (Command) មួយណាដែលបង្កើត Virtual Environment ឈ្មោះ 'ai_env' ក្នុង Python 3?",
        options: ["python -m venv ai_env", "pip create env ai_env", "python --virtual ai_env", "venv --init ai_env"],
        ans: "python -m venv ai_env",
        expEn: "Python's built-in venv module is invoked via `python -m venv <name>`.",
        expKm: "ម៉ូឌុល venv របស់ Python ត្រូវបានហៅប្រើតាមរយៈ `python -m venv ai_env`។"
      },
      {
        topic: "Python & Concurrency", type: "FILL",
        en: "To export all installed packages and exact versions to a file, you run: pip freeze > ________.txt",
        km: "ដើម្បីរក្សាទុកបញ្ជីកញ្ចប់បណ្ណាល័យ (Packages) និងជំនាន់ពិតប្រាកដទៅក្នុងឯកសារ អ្នកត្រូវប្រើ៖ pip freeze > ________.txt",
        ans: "requirements",
        expEn: "`pip freeze > requirements.txt` is the standard way to lock dependencies.",
        expKm: "`pip freeze > requirements.txt` គឺជាវិធីស្តង់ដារសម្រាប់រក្សាទុកបញ្ជីកញ្ចប់បណ្ណាល័យដែលបានដំឡើង។"
      },
      {
        topic: "Python & Concurrency", type: "TF",
        en: "In standard CPython, multiple native threads running CPU-heavy pure Python code execute in parallel across multiple CPU cores simultaneously.",
        km: "នៅក្នុង CPython ការប្រើប្រាស់ Thread ច្រើនសម្រាប់កិច្ចការគណនាធ្ងន់ៗលើ CPU (CPU-bound) នឹងដំណើរការព្រមគ្នាលើ CPU Cores ច្រើនក្នុងពេលតែមួយ។",
        options: ["True", "False"], ans: "False",
        expEn: "False! CPython's Global Interpreter Lock (GIL) allows only one thread to execute Python bytecode at a time.",
        expKm: "មិនពិតទេ! ដោយសារតែ Global Interpreter Lock (GIL) ក្នុង CPython វាអនុញ្ញាតឱ្យតែ Thread មួយប៉ុណ្ណោះដំណើរការ Python Bytecode ក្នុងពេលតែមួយ។"
      },
      {
        topic: "Python & Concurrency", type: "QA",
        en: "When should you choose `multiprocessing` vs `threading` vs `asyncio` in Python AI pipelines?",
        km: "តើនៅពេលណាដែលអ្នកគួរជ្រើសរើសប្រើ `multiprocessing` ធៀបនឹង `threading` និង `asyncio` ក្នុងការងារ AI?",
        ans: "multiprocessing for CPU-bound tasks; threading for blocking I/O; asyncio for high-concurrency network/API I/O.",
        keywords: ["cpu", "i/o", "gil", "process", "network", "api"],

      },
      {

        km: "ការបញ្ឈប់ការបង្វឹកម៉ូដែលនៅពេលដែលកំហុសលើទិន្នន័យ Validation ចាប់ផ្ដើមឡើងខ្ពស់ ទោះបីជាកំហុសលើទិន្នន័យ Train បន្តថយចុះក៏ដោយ ត្រូវបានគេហៅថា ________ Stopping។",

      },
      {

      {

        options: ["True", "False"], ans: "True",
        expEn: "Generalization Gap = Validation/Test Error - Training Error. A large gap indicates overfitting.",
        expKm: "ពិត! Generalization Gap = កំហុសលើទិន្នន័យតេស្ត - កំហុសលើទិន្នន័យបង្វឹក។"

    // ============================================================================
    // 2. PROCEDURAL GENERATOR TO BUILD 208 UNIQUE QUESTIONS ACROSS ALL 8 TOPICS
    // ============================================================================
    function buildFullQuestionBank() {
      const bank = [...coreQuestions];

      // A. Generate 20 Vector Dot Product & Distance Exercises (Topic 5)
      const vecPairs = [
        [[1, 2], [4, 6]], [[2, 3], [5, 7]], [[0, 0], [6, 8]], [[3, 1], [6, 5]],
        [[-1, 2], [2, 6]], [[2, -1], [5, 3]], [[1, 1], [4, 5]], [[5, 2], [1, 5]],
        [[3, 4], [9, 12]], [[2, 5], [7, 17]], [[1, 3], [6, 15]], [[4, 2], [10, 10]],
        [[0, 3], [4, 0]], [[2, 2], [5, 6]], [[7, 1], [4, 5]], [[6, 2], [3, 6]],
        [[10, 5], [7, 9]], [[8, 3], [5, 7]], [[2, 9], [5, 5]], [[4, 7], [1, 3]]
      ];
      vecPairs.forEach((pair, idx) => {
        const [p, q] = pair;
        const dx = Math.abs(q[0] - p[0]);
        const dy = Math.abs(q[1] - p[1]);
        const l1 = dx + dy;
        const l2 = Math.sqrt(dx * dx + dy * dy);
        if (idx % 2 === 0 && Number.isInteger(l2)) {
          bank.push({
            topic: "Vectors & Distance", type: "EX",
            en: `[Vector Math #${idx + 1}] Compute the Euclidean Distance (L2) between point A=(${p[0]}, ${p[1]}) and point B=(${q[0]}, ${q[1]}).`,
            km: `[លំហាត់វ៉ិចទ័រទី ${idx + 1}] ចូរគណនាចម្ងាយ Euclidean (L2) រវាងចំណុច A=(${p[0]}, ${p[1]}) និង B=(${q[0]}, ${q[1]})។`,
            ans: String(l2),
            expEn: `dx = |${q[0]} - (${p[0]})| = ${dx}, dy = |${q[1]} - (${p[1]})| = ${dy}. L2 = sqrt(${dx}^2 + ${dy}^2) = ${l2}.`,
            expKm: `តាមរូបមន្ត L2 = √(${dx}² + ${dy}²) = ${l2}។`
          });
        } else {
          bank.push({
            topic: "Vectors & Distance", type: "EX",
            en: `[Vector Math #${idx + 1}] Compute the Manhattan Distance (L1) between point A=(${p[0]}, ${p[1]}) and point B=(${q[0]}, ${q[1]}).`,
            km: `[លំហាត់វ៉ិចទ័រទី ${idx + 1}] ចូរគណនាចម្ងាយ Manhattan (L1) រវាងចំណុច A=(${p[0]}, ${p[1]}) និង B=(${q[0]}, ${q[1]})។`,
            ans: String(l1),
            expEn: `L1 = |${q[0]} - (${p[0]})| + |${q[1]} - (${p[1]})| = ${dx} + ${dy} = ${l1}.`,
            expKm: `តាមរូបមន្តចម្ងាយ Manhattan L1 = ${dx} + ${dy} = ${l1}។`
          });
        }
      });

      // B. Generate 20 Dot Product Exercises (Topic 5)
      for (let i = 1; i <= 20; i++) {
        const a1 = i, a2 = i + 1, b1 = 2, b2 = 3;
        const dot = a1 * b1 + a2 * b2;
        bank.push({
          topic: "Vectors & Distance", type: "EX",
          en: `[Dot Product #${i}] Given vector u = [${a1}, ${a2}] and vector v = [${b1}, ${b2}], calculate the dot product (u · v).`,
          km: `[ផលគុណស្កាលែទី ${i}] គេមានវ៉ិចទ័រ u = [${a1}, ${a2}] និង v = [${b1}, ${b2}]។ ចូរគណនាផលគុណស្កាលែ (u · v)។`,
          ans: String(dot),
          expEn: `u · v = (${a1} * ${b1}) + (${a2} * ${b2}) = ${a1 * b1} + ${a2 * b2} = ${dot}.`,
          expKm: `u · v = (${a1} × ${b1}) + (${a2} × ${b2}) = ${dot}។`
        });
      }

      // C. Generate 20 NumPy Reshape & Broadcasting Questions (Topic 3)
      const shapes = [
        [4, 6], [3, 8], [5, 7], [9, 4], [10, 12], [6, 6], [7, 8], [12, 5], [15, 4], [8, 9],
        [11, 3], [14, 2], [16, 4], [20, 5], [25, 4], [3, 15], [7, 9], [6, 11], [9, 8], [13, 3]
      ];
      shapes.forEach((sh, i) => {
        const total = sh[0] * sh[1];
        bank.push({
          topic: "NumPy & Preprocessing", type: "FILL",
          en: `[NumPy Shape #${i + 1}] Given a 2D NumPy matrix of shape (${sh[0]}, ${sh[1]}), calling \`.reshape(-1)\` flattens it into a 1D vector of length ________.`,
          km: `[លំហាត់ NumPy ទី ${i + 1}] គេមានម៉ាទ្រីស NumPy ទំហំ (${sh[0]}, ${sh[1]})។ ការហៅ \`.reshape(-1)\` នឹងបង្កើតវ៉ិចទ័រ 1D ដែលមានប្រវែង ________។`,
          ans: String(total),
          expEn: `Total elements = ${sh[0]} * ${sh[1]} = ${total}.`,
          expKm: `ចំនួនធាតុសរុបគឺ ${sh[0]} × ${sh[1]} = ${total}។`
        });
      });

      // D. Generate 20 Gradient Descent Step Exercises (Topic 8)
      for (let i = 1; i <= 20; i++) {
        const w0 = 10 + i;
        const lr = 0.5;
        const grad = 2 * (i % 5 + 1);
        const w1 = w0 - lr * grad;
        bank.push({
          topic: "Gradient Descent & Generalization", type: "EX",
          en: `[Gradient Step #${i}] Current weight w_0 = ${w0}, learning rate alpha = ${lr}, and loss gradient dL/dw = ${grad}. Calculate the updated weight w_1.`,
          km: `[ជំហាន Gradient Descent ទី ${i}] ទម្ងន់បច្ចុប្បន្ន w_0 = ${w0}, Learning rate alpha = ${lr} និងដេរីវេកំហុស dL/dw = ${grad}។ ចូរគណនាទម្ងន់ថ្មី w_1។`,
          ans: String(w1),
          expEn: `w_1 = w_0 - alpha * grad = ${w0} - (${lr} * ${grad}) = ${w1}.`,
          expKm: `w_1 = ${w0} - (${lr} × ${grad}) = ${w1}។`
        });
      }

      // E. Generate 20 Confusion Matrix Precision / Recall / F1 Questions (Topic 7)
      for (let i = 1; i <= 20; i++) {
        const tp = i * 10;
        const fp = i * 10; // makes precision = 0.5
        const fn = i * 30; // makes recall = 0.25
        if (i % 2 === 0) {
          bank.push({
            topic: "Classification & Evaluation", type: "EX",
            en: `[Confusion Matrix #${i}] A binary classifier produces TP = ${tp}, FP = ${fp}, and FN = ${fn}. Calculate Precision as a decimal (e.g., 0.5).`,
            km: `[រង្វាស់ Classification ទី ${i}] ម៉ូដែលមួយមាន TP = ${tp}, FP = ${fp}, និង FN = ${fn}។ ចូរគណនាតម្លៃ Precision ជាទសភាគ។`,
            ans: "0.5",
            expEn: `Precision = TP / (TP + FP) = ${tp} / (${tp} + ${fp}) = 0.5.`,
            expKm: `Precision = TP / (TP + FP) = ${tp} / (${tp} + ${fp}) = 0.5។`
          });
        } else {
          bank.push({
            topic: "Classification & Evaluation", type: "EX",
            en: `[Confusion Matrix #${i}] A binary classifier produces TP = ${tp}, FP = ${fp}, and FN = ${fn}. Calculate Recall as a decimal (e.g., 0.25).`,
            km: `[រង្វាស់ Classification ទី ${i}] ម៉ូដែលមួយមាន TP = ${tp}, FP = ${fp}, និង FN = ${fn}។ ចូរគណនាតម្លៃ Recall ជាទសភាគ។`,
            ans: "0.25",
            expEn: `Recall = TP / (TP + FN) = ${tp} / (${tp} + ${fn}) = 0.25.`,
            expKm: `Recall = TP / (TP + FN) = ${tp} / (${tp} + ${fn}) = 0.25។`
          });
        }
      }

      // F. Generate 20 Regression MSE & MAE Calculations (Topic 6)
      for (let i = 1; i <= 20; i++) {
        const yTrue = i + 5;
        const yPred = i + 2; // error = 3
        const mse = 9;
        const mae = 3;
        if (i % 2 === 0) {
          bank.push({
            topic: "Regression & Overfitting", type: "EX",
            en: `[Regression Loss #${i}] For a single data point with true target y = ${yTrue} and prediction y_hat = ${yPred}, what is the Squared Error (y - y_hat)^2?`,
            km: `[ការគណនា Loss ទី ${i}] សម្រាប់ទិន្នន័យដែលមានតម្លៃពិត y = ${yTrue} និងតម្លៃទស្សន៍ទាយ y_hat = ${yPred} តើកំហុសការ៉េ (y - y_hat)² ស្មើប៉ុន្មាន?`,
            ans: String(mse),
            expEn: `(${yTrue} - ${yPred})^2 = 3^2 = 9.`,
            expKm: `(${yTrue} - ${yPred})² = 3² = 9។`
          });
        } else {
          bank.push({
            topic: "Regression & Overfitting", type: "EX",
            en: `[Regression Loss #${i}] For a single data point with true target y = ${yTrue} and prediction y_hat = ${yPred}, what is the Absolute Error |y - y_hat|?`,
            km: `[ការគណនា Loss ទី ${i}] សម្រាប់ទិន្នន័យដែលមានតម្លៃពិត y = ${yTrue} និងតម្លៃទស្សន៍ទាយ y_hat = ${yPred} តើកំហុសដាច់ខាត |y - y_hat| ស្មើប៉ុន្មាន?`,
            ans: String(mae),
            expEn: `|${yTrue} - ${yPred}| = 3.`,
            expKm: `|${yTrue} - ${yPred}| = 3។`
          });
        }
      }

      // G. Generate 20 Train/Validation/Test Split & Cross-Validation Exercises (Topic 4)
      for (let i = 1; i <= 20; i++) {
        const totalRows = i * 1000;
        const testPct = 20;
        const testRows = totalRows * 0.2;
        bank.push({
          topic: "ML Workflow", type: "EX",
          en: `[Data Split #${i}] You have a dataset of ${totalRows.toLocaleString()} rows and reserve ${testPct}% for the Test Set. How many rows are in the Test Set?`,
          km: `[ការបែងចែកទិន្នន័យទី ${i}] អ្នកមានទិន្នន័យសរុបចំនួន ${totalRows.toLocaleString()} ជួរ ហើយទុក ${testPct}% សម្រាប់ Test Set។ តើក្នុង Test Set មានប៉ុន្មានជួរ?`,
          ans: String(testRows),
          expEn: `${totalRows} * 0.20 = ${testRows} rows.`,
          expKm: `${totalRows} × 20% = ${testRows} ជួរ។`
        });
      }

      // H. Generate 20 Asyncio & Concurrency Timing Questions & AI Scenarios (Topics 1 & 2)
      for (let i = 1; i <= 21; i++) {
        if (i % 2 === 0) {
          const reqs = i + 5;
          const ms = (i % 4 + 1) * 100;
          bank.push({
            topic: "Python & Concurrency", type: "MCQ",
            en: `[Concurrency #${i}] You run ${reqs} non-blocking network calls concurrently with \`asyncio.gather()\`. Each call takes ${ms}ms. What is the approximate total time?`,
            km: `[Concurrency ទី ${i}] អ្នកហៅ API ចំនួន ${reqs} ក្នុងពេលតែមួយដោយប្រើ \`asyncio.gather()\` ដែលសំណើនីមួយៗប្រើពេល ${ms}ms។ តើរយៈពេលសរុបប្រហែលប៉ុន្មាន?`,
            options: [`~${ms}ms`, `${reqs * ms}ms`, `${reqs * 1000}ms`, `0ms`],
            ans: `~${ms}ms`,
            expEn: `Concurrent non-blocking I/O completes in roughly the duration of a single call (~${ms}ms).`,
            expKm: `ការហៅព្រមគ្នាតាមរយៈ Asyncio ចំណាយពេលប្រហែលនឹងសំណើតែមួយប៉ុណ្ណោះ (~${ms}ms)។`
          });
        } else {
          const isSupervised = i % 3 === 0;
          bank.push({
            topic: "AI Landscape", type: "TF",
            en: `[AI Paradigm #${i}] Training a model on ${i * 500} labeled chest X-ray images (with 'Pneumonia' vs 'Healthy' ground-truth tags) is an example of Supervised Learning.`,
            km: `[ទម្រង់នៃការរៀន AI ទី ${i}] ការបង្វឹកម៉ូដែលលើរូបភាព X-ray ចំនួន ${i * 500} ដែលមានស្លាកចម្លើយស្រាប់ ('មានជំងឺ' ឬ 'ធម្មតា') គឺជា Supervised Learning។`,
            options: ["True", "False"],
            ans: "True",
            expEn: `Learning from labeled input-output pairs is the definition of Supervised Learning.`,
            expKm: `ពិត! ការបង្វឹកម៉ូដែលដោយមានទិន្នន័យភ្ជាប់ជាមួយស្លាកចម្លើយត្រឹមត្រូវ (Labeled Data) គឺជា Supervised Learning។`
          });
        }
      }

      return bank.map((q, index) => ({ ...q, id: index + 1 }));
    }

    // ============================================================================
    // 3. STATE MANAGEMENT & EXAM ENGINE
    // ============================================================================
    const masterBank = buildFullQuestionBank();
    let activeQuestions = [];
    let userAnswers = {};
    let isSubmitted = false;
    let currentLang = 'both'; // 'both' | 'en' | 'km'
    let secondsElapsed = 0;
    let timerInterval = null;

    document.getElementById('poolCountBadge').textContent = masterBank.length;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      updateTimerUI();
      timerInterval = setInterval(() => {
        if (!isSubmitted) {
          secondsElapsed++;
          updateTimerUI();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
    }

    function startNewRandomExam() {
      isSubmitted = false;
      userAnswers = {};
      document.getElementById('resultBanner').classList.add('hidden');
      document.getElementById('submitBtn').classList.remove('hidden');
      document.getElementById('topicFilter').value = 'ALL';
      document.getElementById('typeFilter').value = 'ALL';

      // Draw 50 random questions from the 208-question bank
      activeQuestions = shuffleArray(masterBank).slice(0, 50).map((q, idx) => ({
        ...q,
        examNumber: idx + 1
      }));

      startTimer();
      renderMatrix();
      renderQuestions();
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function browseAllBank() {
      isSubmitted = false;
      userAnswers = {};
      document.getElementById('resultBanner').classList.add('hidden');
      activeQuestions = masterBank.map((q, idx) => ({
        ...q,
        examNumber: idx + 1
      }));
      renderMatrix();
      renderQuestions();
      updateProgress();
    }

    function setLanguage(lang) {
      currentLang = lang;
      ['both', 'en', 'km'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (l === lang) {
          btn.className = "px-2.5 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition font-semibold";
        } else {
          btn.className = "px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";
        }
      });
      renderQuestions();
    }

    function recordAnswer(examNum, val) {
      if (isSubmitted) return;
      if (val && String(val).trim() !== '') {
        userAnswers[examNum] = String(val).trim();
      } else {
        delete userAnswers[examNum];
      }
      updateProgress();
      renderMatrix();
    }

    function updateProgress() {
      const total = activeQuestions.length;
      const count = Object.keys(userAnswers).length;
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      document.getElementById('progressText').textContent = `${count} / ${total} Answered`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function renderMatrix() {
      const container = document.getElementById('questionMatrix');
      container.innerHTML = activeQuestions.map(q => {
        const answered = userAnswers[q.examNumber] !== undefined;
        let colorClass = answered
          ? 'bg-indigo-600 text-white border-indigo-600'
          : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-indigo-400';

        if (isSubmitted) {
          const correct = evaluateAnswer(q, userAnswers[q.examNumber]);
          colorClass = correct
            ? 'bg-emerald-600 text-white border-emerald-600'
            : 'bg-rose-600 text-white border-rose-600';
        }

        return `
          <button onclick="jumpToQuestion(${q.examNumber})"
            class="h-7 rounded text-xs font-semibold border transition flex items-center justify-center ${colorClass}">
            ${q.examNumber}
          </button>
        `;
      }).join('');
    }

    function jumpToQuestion(num) {
      const el = document.getElementById(`q-card-${num}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function evaluateAnswer(q, userVal) {
      if (!userVal) return false;
      const cleanUser = userVal.toLowerCase().trim();
      const cleanAns = q.ans.toLowerCase().trim();

      if (q.type === 'TF' || q.type === 'MCQ') {
        return cleanUser === cleanAns;
      }
      if (q.type === 'FILL' || q.type === 'EX') {
        // Check numeric equivalence if both parse as numbers
        const numU = parseFloat(cleanUser);
        const numA = parseFloat(cleanAns);
        if (!isNaN(numU) && !isNaN(numA) && cleanAns.indexOf('(') === -1) {
          return Math.abs(numU - numA) < 0.05;
        }
        return cleanUser.replace(/\s+/g, '') === cleanAns.replace(/\s+/g, '') || cleanAns.includes(cleanUser);
      }
      if (q.type === 'QA') {
        if (cleanUser.length < 8) return false;
        if (!q.keywords) return true;
        const matched = q.keywords.filter(kw => cleanUser.includes(kw.toLowerCase()));
        return matched.length >= 1;
      }
      return false;
    }

    function getTypeBadge(type) {
      const map = {
        TF: { label: "True / False • ពិត ឬ មិនពិត", cls: "bg-amber-50 text-amber-700 border-amber-200" },
        MCQ: { label: "Multiple Choice • ជ្រើសរើសចម្លើយ", cls: "bg-blue-50 text-blue-700 border-blue-200" },
        FILL: { label: "Fill in Blank • បំពេញចន្លោះ", cls: "bg-purple-50 text-purple-700 border-purple-200" },
        EX: { label: "Exercise • លំហាត់គណនា", cls: "bg-emerald-50 text-emerald-700 border-emerald-200" },
        QA: { label: "Q&A • សំណួរទ្រឹស្ដី", cls: "bg-rose-50 text-rose-700 border-rose-200" }
      };
      return map[type] || { label: type, cls: "bg-slate-100 text-slate-700" };
    }

    function renderQuestions() {
      const topicFilter = document.getElementById('topicFilter').value;
      const typeFilter = document.getElementById('typeFilter').value;
      const container = document.getElementById('questionsContainer');

      const filtered = activeQuestions.filter(q => {
        const matchTopic = topicFilter === 'ALL' || q.topic === topicFilter;
        const matchType = typeFilter === 'ALL' || q.type === typeFilter;
        return matchTopic && matchType;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500">
            No questions match this filter in the current set. Reset filter to view all questions.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(q => {
        const badge = getTypeBadge(q.type);
        const savedAns = userAnswers[q.examNumber] || '';
        const isCorrect = isSubmitted ? evaluateAnswer(q, savedAns) : null;

        let borderClass = "border-slate-200";
        if (isSubmitted) {
          borderClass = isCorrect ? "border-emerald-500 bg-emerald-50/10" : "border-rose-400 bg-rose-50/10";
        }

        // Question Text according to language mode
        let promptHTML = '';
        if (currentLang === 'both') {
          promptHTML = `
            <p class="text-slate-900 font-semibold text-base leading-relaxed">${q.en}</p>
            <p class="text-slate-600 khmer-text text-sm mt-1.5 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${q.km}</p>
          `;
        } else if (currentLang === 'en') {
          promptHTML = `<p class="text-slate-900 font-semibold text-base leading-relaxed">${q.en}</p>`;
        } else {
          promptHTML = `<p class="text-slate-900 font-semibold text-base khmer-text leading-relaxed">${q.km}</p>`;
        }

        // Input Controls
        let inputHTML = '';
        if (q.type === 'TF' || q.type === 'MCQ') {
          inputHTML = `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">
              ${q.options.map(opt => {
                const checked = savedAns === opt;
                const escapedOpt = opt.replace(/'/g, "\\'");
                return `
                  <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${
                    checked ? 'border-indigo-600 bg-indigo-50/60 font-medium text-indigo-950' : 'border-slate-200 hover:bg-slate-50'
                  }">
                    <input type="radio" name="q-${q.examNumber}" value="${opt}"
                      ${checked ? 'checked' : ''}
                      ${isSubmitted ? 'disabled' : ''}
                      onchange="recordAnswer(${q.examNumber}, '${escapedOpt}'); renderQuestions();"
                      class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
                    <span class="text-sm">${opt}</span>
                  </label>
                `;
              }).join('')}
            </div>
          `;
        } else if (q.type === 'FILL' || q.type === 'EX') {
          inputHTML = `
            <div class="mt-3">
              <input type="text"
                placeholder="Type your answer / បញ្ចូលចម្លើយរបស់អ្នក..."
                value="${savedAns.replace(/"/g, '&quot;')}"
                ${isSubmitted ? 'disabled' : ''}
                oninput="recordAnswer(${q.examNumber}, this.value)"
                class="w-full sm:w-96 px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 khmer-text" />
            </div>
          `;
        } else if (q.type === 'QA') {
          inputHTML = `
            <div class="mt-3">
              <textarea rows="3"
                placeholder="Write your explanation in English or Khmer / សរសេរការពន្យល់របស់អ្នកជាភាសាអង់គ្លេស ឬខ្មែរ..."
                ${isSubmitted ? 'disabled' : ''}
                oninput="recordAnswer(${q.examNumber}, this.value)"
                class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 khmer-text">${savedAns}</textarea>
            </div>
          `;
        }

        // Solution & Explanation Box (Shown after submit)
        let explanationHTML = '';
        if (isSubmitted) {
          explanationHTML = `
            <div class="mt-4 p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'} text-xs sm:text-sm space-y-1.5">
              <div class="font-bold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                ${isCorrect ? '✓ Correct / ត្រឹមត្រូវ!' : '✗ Needs Review / ចម្លើយមិនទាន់ត្រឹមត្រូវ'}
                — Official Answer: <span class="underline">${q.ans}</span>
              </div>
              <p class="text-slate-700">${q.expEn}</p>
              <p class="text-slate-700 khmer-text">${q.expKm}</p>
            </div>
          `;
        }

        return `
          <article id="q-card-${q.examNumber}" class="bg-white rounded-2xl border-2 ${borderClass} p-5 shadow-sm transition">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white font-bold text-xs">
                  Q${q.examNumber}
                </span>
                <span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200">
                  ${q.topic}
                </span>
                <span class="px-2.5 py-1 rounded-lg text-xs font-medium border ${badge.cls} khmer-text">
                  ${badge.label}
                </span>
              </div>
              <span class="text-[11px] text-slate-400 font-mono">Bank ID #${q.id}</span>
            </div>

            ${promptHTML}
            ${inputHTML}
            ${explanationHTML}
          </article>
        `;
      }).join('');
    }

    function submitExam() {
      isSubmitted = true;
      clearInterval(timerInterval);

      let correctCount = 0;
      const topicStats = {};

      activeQuestions.forEach(q => {
        if (!topicStats[q.topic]) {
          topicStats[q.topic] = { total: 0, correct: 0 };
        }
        topicStats[q.topic].total++;
        if (evaluateAnswer(q, userAnswers[q.examNumber])) {
          correctCount++;
          topicStats[q.topic].correct++;
        }
      });

      const total = activeQuestions.length;
      const pct = Math.round((correctCount / total) * 100);

      document.getElementById('scoreHeadline').textContent = `Score: ${correctCount} / ${total} (${pct}%)`;
      document.getElementById('scoreSubtext').textContent =
        pct >= 80
          ? "អបអរសាទរ! អ្នកត្រៀមខ្លួនបានល្អណាស់សម្រាប់ការប្រឡងខែទី ១ (Excellent Readiness!)"
          : "សូមពិនិត្យមើលចម្លើយ និងការពន្យល់ខាងក្រោមដើម្បីពង្រឹងបន្ថែម (Review explanations below to improve!)";
      document.getElementById('finalTimeTaken').textContent = document.getElementById('timerDisplay').textContent;

      // Render Topic Breakdown
      const breakdownEl = document.getElementById('topicBreakdownGrid');
      breakdownEl.innerHTML = Object.entries(topicStats).map(([topic, st]) => {
        const tPct = Math.round((st.correct / st.total) * 100);
        return `
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
            <div class="text-xs font-semibold text-slate-700 truncate">${topic}</div>
            <div class="flex items-baseline justify-between mt-1">
              <span class="text-base font-bold text-indigo-600">${st.correct}/${st.total}</span>
              <span class="text-xs text-slate-500">${tPct}%</span>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('resultBanner').classList.remove('hidden');
      renderMatrix();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize first 50-question random exam on load
    startNewRandomExam();
  </script>
</body>
</html>
